[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-research-portfolio"
version = "1.0.0"
description = "Leakage-safe PF, GeoHMM, HGRG, Meta-State and nested wellbore trajectory research pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "joblib==1.5.3",
  "numba==0.61.0",
  "matplotlib==3.9.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -s"
